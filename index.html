<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Automatic Sliding Door – Proximity Sensor Demos</title>
  <style>
    :root{
      --bg:#0f172a;         /* slate-900 */
      --panel:#111827;      /* gray-900 */
      --accent:#22d3ee;     /* cyan-400 */
      --accent-2:#38bdf8;   /* sky-400 */
      --glass:#1f2937cc;    /* gray-800 w/ alpha */
      --door:#e5e7eb;       /* gray-200 */
      --sensor:#22c55e;     /* green-500 */
      --warn:#f97316;       /* orange-500 */
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
      background: radial-gradient(1200px 600px at 70% -10%, #1e293b 15%, var(--bg));
      color:#e2e8f0; display:flex; align-items:center; justify-content:center; padding:24px;
    }

    .app{max-width:1100px; width:100%;}

    .card{
      background:linear-gradient(180deg, #111827, #0b1224);
      border:1px solid #1f2a44; border-radius:20px; box-shadow:0 20px 60px rgba(2,8,23,.45);
      overflow:hidden;
    }

    header{
      display:flex; align-items:center; gap:12px; padding:16px 20px; border-bottom:1px solid #1f2a44;
      background:linear-gradient(180deg, rgba(56,189,248,.12), rgba(34,211,238,.08));
    }
    header h1{font-size:18px; margin:0; font-weight:700; letter-spacing:.2px}
    header .dot{width:10px; height:10px; border-radius:50%; background:var(--accent); box-shadow:0 0 16px var(--accent)}

    .wrap{display:grid; grid-template-columns: 1.2fr .8fr; gap:18px; padding:18px;}
    @media (max-width: 900px){.wrap{grid-template-columns:1fr}}

    /* --- SCENE --- */
    .scene{
      position:relative; height:520px; border-radius:16px; background: radial-gradient(1000px 300px at 50% -30%, #1b2540, #0b1224);
      border:1px solid #1f2a44; overflow:hidden;
    }

    .floor{position:absolute; inset:auto 0 0 0; height:38%; background:linear-gradient(180deg, #0f172a, #0a0f1f)}
    .ceiling{position:absolute; inset:0 0 auto 0; height:8%; background:linear-gradient(180deg, #0a0f1f, transparent)}

    .entrance{
      position:absolute; left:50%; top:52%; transform:translate(-50%,-50%);
      width:520px; height:340px; background:linear-gradient(180deg, #0c1427, #0a0f1f);
      border:1px solid #1f2a44; border-radius:14px; box-shadow: inset 0 0 0 2px rgba(34,211,238,.05);
    }
    .track{position:absolute; left:50%; top:64px; transform:translateX(-50%); width:460px; height:8px; background:#111827; border-radius:4px; box-shadow:0 1px 0 #0b1224, inset 0 1px 0 #0e162b}

    .door{
      position:absolute; top:80px; width:230px; height:240px; background:linear-gradient(180deg, #f8fafc, #e5e7eb);
      border:1px solid #cbd5e1; border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,.25);
      transition: transform .7s cubic-bezier(.2,.8,.2,1);
    }
    .door::after{ /* vertical handle */
      content:""; position:absolute; top:50%; transform:translateY(-50%);
      width:5px; height:70px; background:#94a3b8; border-radius:4px; opacity:.9
    }
    .door.left{ left:30px; transform:translateX(0)}
    .door.left::after{ right:12px }
    .door.right{ right:30px; transform:translateX(0)}
    .door.right::after{ left:12px }

    .door.open.left{ transform:translateX(-210px) }
    .door.open.right{ transform:translateX(210px) }

    .sensor-zone{
      position:absolute; left:50%; bottom:12px; transform:translateX(-50%);
      width:380px; height:120px; border-radius:80px; background:radial-gradient(220px 120px at 50% 100%, rgba(34,197,94,.18), transparent 70%);
      border:1px dashed rgba(34,197,94,.45);
    }

    .beacon{
      position:absolute; left:50%; bottom:76px; transform:translateX(-50%);
      width:18px; height:18px; border-radius:50%; background:var(--sensor); box-shadow:0 0 18px var(--sensor), 0 0 60px rgba(34,197,94,.5);
      animation:pulse 1.6s infinite ease-in-out;
    }
    @keyframes pulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.25)}}

    .person{
      position:absolute; width:34px; height:34px; border-radius:50%; border:2px solid #94a3b8; background:radial-gradient(circle at 30% 30%, #cbd5e1, #64748b);
      box-shadow:0 4px 10px rgba(0,0,0,.35);
      pointer-events:none; transition:filter .2s;
    }

    /* --- SIDEPANEL --- */
    .panel{background:linear-gradient(180deg, #0c1427, #0a0f1f); border:1px solid #1f2a44; border-radius:14px; padding:16px;}
    .row{display:flex; gap:10px; align-items:center; margin-bottom:10px}
    .panel h2{font-size:16px; margin:.2rem 0 1rem 0}
    .btn{padding:9px 14px; border-radius:12px; border:1px solid #24406f; background:linear-gradient(180deg, #0f1b34, #0b1324); color:#c7d2fe; cursor:pointer; font-weight:600}
    .btn:active{transform:translateY(1px)}
    .btn.secondary{color:#7dd3fc}
    .btn.warn{color:#fed7aa; border-color:#7a3416; background:linear-gradient(180deg,#1b0f07,#150b06)}

    .toggle{display:inline-flex; align-items:center; gap:8px; cursor:pointer}
    .toggle input{appearance:none; width:44px; height:26px; background:#0b1324; border:1px solid #24406f; border-radius:40px; position:relative; outline:0}
    .toggle input:before{content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#1f2a44; transition:.2s}
    .toggle input:checked{background:#0b1e36}
    .toggle input:checked:before{left:22px; background:linear-gradient(180deg, var(--accent), var(--accent-2))}

    .status{margin-top:8px; padding:10px 12px; border-radius:12px; background:rgba(56,189,248,.08); border:1px solid #1f2a44; font-size:14px}
    .meter{height:8px; border-radius:8px; background:#0a1222; border:1px solid #20345a; overflow:hidden}
    .meter span{display:block; height:100%; width:0%; background:linear-gradient(90deg, var(--accent), var(--accent-2)); transition:width .1s}

    .kbd{font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; padding:.15rem .4rem; border-radius:6px; background:#0b1324; border:1px solid #24406f; color:#93c5fd; font-size:.86em}
    .help{opacity:.8; font-size:13px}
  </style>
</head>
<body>
  <div class="app card" role="application" aria-label="Automatic door with simulated proximity sensor">
    <header>
      <span class="dot" aria-hidden="true"></span>
      <h1>Automatic Sliding Door — Proximity Sensor Simulation</h1>
    </header>

    <div class="wrap">
      <!-- Scene -->
      <section class="scene" id="scene" aria-live="polite">
        <div class="ceiling"></div>
        <div class="floor"></div>

        <div class="entrance" aria-label="Glass entrance with two sliding doors">
          <div class="track" aria-hidden="true"></div>
          <div class="door left" id="doorLeft" aria-hidden="true"></div>
          <div class="door right" id="doorRight" aria-hidden="true"></div>
        </div>

        <div class="sensor-zone" id="sensor" aria-label="Sensor zone"></div>
        <div class="beacon" aria-hidden="true"></div>
        <div class="person" id="person" aria-hidden="true"></div>
      </section>

      <!-- Controls -->
      <aside class="panel" aria-label="Controls">
        <h2>Controls</h2>
        <div class="row">
          <button class="btn" id="openBtn" title="Open (O)">Open</button>
          <button class="btn secondary" id="closeBtn" title="Close (C)">Close</button>
          <button class="btn warn" id="resetBtn" title="Reset person to start (R)">Reset</button>
        </div>

        <label class="toggle" title="Toggle automatic mode (A)">
          <input id="autoToggle" type="checkbox" checked>
          <span>Automatic mode (proximity)</span>
        </label>

        <p class="help">Move your cursor toward the green sensor glow to simulate a person approaching. Doors auto-close after idle. Shortcuts: <span class="kbd">A</span> toggle auto, <span class="kbd">O</span> open, <span class="kbd">C</span> close, <span class="kbd">R</span> reset.</p>

        <div class="status">
          <div>Door status: <strong id="stateText">Closed</strong></div>
          <div style="margin:.5rem 0 .25rem">Proximity</div>
          <div class="meter"><span id="proxBar" style="width:0%"></span></div>
        </div>
      </aside>
    </div>
  </div>

  <script>
    // ---- Elements
    const left = document.getElementById('doorLeft');
    const right = document.getElementById('doorRight');
    const sensor = document.getElementById('sensor');
    const person = document.getElementById('person');
    const stateText = document.getElementById('stateText');
    const proxBar = document.getElementById('proxBar');
    const autoToggle = document.getElementById('autoToggle');
    const openBtn = document.getElementById('openBtn');
    const closeBtn = document.getElementById('closeBtn');
    const resetBtn = document.getElementById('resetBtn');
    const scene = document.getElementById('scene');

    // ---- State
    let isOpen = false;
    let autoMode = true;
    let closeTimer = null;

    const OPEN_THRESHOLD = 150; // px radius around sensor center
    const CLOSE_DELAY = 1200;   // ms idle before closing

    // Initial positions
    placePersonAtStart();
    updateDoor(false);

    // ---- Helpers
    function updateDoor(open){
      isOpen = open;
      left.classList.toggle('open', open);
      right.classList.toggle('open', open);
      stateText.textContent = open ? 'Open' : 'Closed';
    }

    function centerOf(el){
      const r = el.getBoundingClientRect();
      return { x: r.left + r.width/2, y: r.top + r.height/2 };
    }

    function distance(a,b){
      const dx = a.x - b.x; const dy = a.y - b.y; return Math.hypot(dx, dy);
    }

    function setProximity(value){ // value in [0,1]
      proxBar.style.width = (value*100).toFixed(0) + '%';
      person.style.filter = `brightness(${0.9 + value*0.4})`;
    }

    function placePersonAtStart(){
      const r = scene.getBoundingClientRect();
      person.style.left = (r.left + r.width * 0.15) + 'px';
      person.style.top  = (r.top  + r.height * 0.78) + 'px';
    }

    function scheduleClose(){
      if (closeTimer) clearTimeout(closeTimer);
      closeTimer = setTimeout(() => {
        if (!autoMode) return; // respect manual mode
        updateDoor(false);
      }, CLOSE_DELAY);
    }

    // ---- Proximity simulation (mouse)
    window.addEventListener('mousemove', (e) => {
      // Move the person avatar toward cursor smoothly
      person.style.left = (e.clientX - 17) + 'px';
      person.style.top  = (e.clientY - 17) + 'px';

      if (!autoMode) return;

      const cSensor = centerOf(sensor);
      const p = {x:e.clientX, y:e.clientY};
      const d = distance(p, cSensor);
      const proximity = Math.max(0, 1 - d/OPEN_THRESHOLD);
      setProximity(Math.min(1, proximity));

      if (d < OPEN_THRESHOLD){
        updateDoor(true);
        if (closeTimer) clearTimeout(closeTimer);
      } else if (isOpen){
        scheduleClose();
      }
    });

    // ---- Manual controls
    openBtn.addEventListener('click', () => { updateDoor(true); });
    closeBtn.addEventListener('click', () => { updateDoor(false); });
    resetBtn.addEventListener('click', () => { placePersonAtStart(); setProximity(0); });
    autoToggle.addEventListener('change', (e) => { autoMode = e.target.checked; });

    // ---- Keyboard shortcuts
    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'o'){ updateDoor(true); }
      if (k === 'c'){ updateDoor(false); }
      if (k === 'a'){ autoToggle.checked = !autoToggle.checked; autoMode = autoToggle.checked; }
      if (k === 'r'){ placePersonAtStart(); setProximity(0); }
    });

    // Resize handling keeps person within scene bounds
    window.addEventListener('resize', () => { setProximity(0); });
  </script>
</body>
</html>
